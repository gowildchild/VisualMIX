name: VisualMIX | Validation & Integrity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pre-verify-gate:
    runs-on: ubuntu-latest
    steps:
    - name: VisualMIX | Checkout Repository Source
      uses: actions/checkout@v4

    - name: VisualMIX | Set up Environments
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: VisualMIX | Validation Check
      run: |
        echo "[Validation CHECK] Auditing codebase structures for compilation anomalies..."
        # Validates all workspace JSON files to trap any parsing breaks before local execution
        find . -name "*.json" -type f ! -name "sign_integrity_config.json" -exec python3 -m json.tool {} \; > /dev/null

        find . -name "*.js" -type f -exec node --check {} \;

        find . -name "*.yml" -o -name "*.yaml" -type f | while read -r file; do
          python3 -c "import yaml, sys; yaml.safe_load(open('$file'))" 2>/dev/null
          if [ $? -ne 0 ]; then
            echo "[VALIDATION ERROR] ❌ YAML Format Error: $file"
            exit 1
          fi
        done

        python3 -m py_compile master/tools/visualmix_integrity.py
        
        echo "[Validation OK] All repository source syntax structures are fine."

    - name: VisualMIX | Integrity Check
      run: |
        echo "[Integrity CHECK] Auditing codebase structures for integrity anomalies..."
        python3 -m py_compile master/tools/visualmix_integrity.py
        echo "[Integrity OK] All repository source syntax structures are pristine."      

name: VisualMIX | Validate Verify Sign Manifest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  visualmix-verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository | VisualMIX
      uses: actions/checkout@v4

    - name: Detect Code Changes | VisualMIX
      id: filter
      uses: dorny/paths-filter@v3
      with:
        list-files: 'shell'
        filters: |
          json:
            - added|modified: '**/*.json'
          js:
            - added|modified: '**/*.js'
          yaml:
            - added|modified: '**/*.yml'
            - added|modified: '**/*.yaml'
          python:
            - added|modified: 'master/build-tools/visualmix_integrity.py'

    - name: Set up Environment | VisualMIX
      if: steps.filter.outputs.json == 'true' || steps.filter.outputs.yaml == 'true' || steps.filter.outputs.python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js | VisualMIX
      if: steps.filter.outputs.js == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate JSON Files | VisualMIX
      if: steps.filter.outputs.json == 'true'
      run: |
        echo "[VALIDATING] Auditing modified JSON files..."
        for file in ${{ steps.filter.outputs.json_files }}; do
          if [ "$file" != "sign_integrity_config.json" ] && [ -f "$file" ]; then
            python3 -m json.tool "$file" > /dev/null
            echo "[VALIDATED ✅] JSON Files: $file"
          fi
        done

    - name: Validate JavaScript Files | VisualMIX
      if: steps.filter.outputs.js == 'true'
      run: |
        echo "[VALIDATING] Auditing modified JavaScript files..."
        for file in ${{ steps.filter.outputs.js_files }}; do
          if [ -f "$file" ]; then
            node --check "$file"
            echo "[VALIDATED ✅] JS Files: $file"
          fi
        done

    - name: Validate YAML/YML Files | VisualMIX
      if: steps.filter.outputs.yaml == 'true'
      run: |
        echo "[VALIDATING] Auditing modified YAML files..."
        pip install pyyaml --quiet
        for file in ${{ steps.filter.outputs.yaml_files }}; do
          if [ -f "$file" ]; then
            python3 -c "import yaml; yaml.safe_load(open('$file', 'r', encoding='utf-8'))"
            echo "[VALIDATED ✅] YAML Parsing: $file"
          fi
        done

    - name: Validate Core Engine | VisualMIX
      if: steps.filter.outputs.python == 'true'
      run: |
        echo "[VALIDATING] Auditing modified Python Core files..."
        python3 -m py_compile master/build-tools/visualmix_integrity.py
        echo "[VALIDATED ✅] Python Compilation Core"

    - name: Validated Pipeline | VisualMIX
      run: |
        echo "[VALIDATED ✅] All repository changes are cryptographically pristine."

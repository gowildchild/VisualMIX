<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualMIX | Zero-Trust Integrity Console</title>
    <link rel="stylesheet" href="universal_style.css">
    <link rel="stylesheet" href="universal_style_menu.css">
    <script src="https://cdn.jsdelivr.net/gh/gowildchild/VisualMIX@07d5fda/integrity_check/universal_crypto.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/gowildchild/VisualMIX@d9c63ac/integrity_check/universal_meta.js" defer></script>
</head>
<body>
    <nav class="top-navbar">
        <a href="#" class="nav-brand">VisualMIX Console</a>
        <ul class="nav-menu">
            <li class="nav-item active"><a href="/VisualMIX/integrity_check/">Integrity Check</a></li>
            <li class="nav-item"><a href="#">Bitshift Magic</a></li>
            <li class="nav-item"><a href="https://github.com/gowildchild/existenZ/" target="_blank" rel="noopener">existenZ</a>a></li>
            <li class="nav-item"><a href="https://github.com/gowildchild/VisualMIX/" target="_blank" rel="noopener">GitHub Repository</a></li>
        </ul>
    </nav>

    <div class="dashboard-container">
        <!-- Status & Monitoring Bar -->
        <div class="panel" style="flex-direction: row; justify-content: space-between; align-items: center; padding: 8px 12px;">
            <div class="led-container">
                <div id="status-led" class="led-indicator led-orange"></div>
                <span id="status-text">Booting VisualkMIX Engine</span>
            </div>
            <div style="font-size: 11px; color: var(--text-muted);" id="file-status">Initializing memory caches...</div>
        </div>

        <!-- Master Two-Column Operational Layout Grid Workspace -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px;">
            
            <!-- LEFT FLANK PANELS FRAME: Inputs and Check Intercept Boxes -->
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <!-- 🧩 Tabbed Container Panel (Houses both Box 1 and Box 2 symmetrically) -->
                <div class="panel" id="configuration-workspace">
                    <div style="display: flex; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 8px;">
                        <button id="tab-btn-meta" class="secondary" onclick="switchConfigurationTab('meta')" style="flex: 1; padding: 6px;">1. Master Meta Configuration</button>
                        <button id="tab-btn-source" class="secondary" onclick="switchConfigurationTab('source')" style="flex: 1; padding: 6px;">2. Protected Source Blueprint</button>
                    </div>

                    <!-- Inner Box 1 Panel View Segment -->
                    <div id="view-segment-meta">
                        <label>Meta Profile Ingestion Route Select:</label>
                        <select id="meta-source-select" onchange="togglePanelNodeVisibility('meta')">
                            <option value="JSON_FILE">JSON_FILE</option>
                            <option value="URL">URL</option>
                            <option value="INPUT">INPUT</option>
                            <option value="DIRECT">DIRECT</option>
                        </select>
                        <div id="meta-url-container" class="hidden-node" style="margin-top: 6px;">
                            <label>Active Meta Configuration Remote Resource URL Location Target:</label>
                            <input type="text" id="meta-url-field" placeholder="https://githubusercontent.com" onchange="syncPanelData('meta')">
                        </div>
                        <div id="meta-input-container" style="margin-top: 6px;">
                            <label>Raw Meta Configuration Script Payload Editor Buffer:</label>
                            <textarea id="meta-json-area" placeholder="Awaiting master meta-profile definition dataset ingestion loop..." oninput="handleTypingState('meta')" style="height: 160px;"></textarea>
                        </div>
                    </div>

                    <!-- Inner Box 2 Panel View Segment -->
                    <div id="view-segment-source" class="hidden-node">
                        <label>Source Blueprint Ingestion Route Select:</label>
                        <select id="test-source-select" onchange="togglePanelNodeVisibility('source')">
                            <option value="json_src_challenge">json_src_challenge</option>
                            <option value="json_src_integrity">json_src_integrity</option>
                            <option value="URL">URL</option>
                            <option value="INPUT">INPUT</option>
                            <option value="DIRECT">DIRECT</option>
                        </select>
                        <div id="test-url-container" class="hidden-node" style="margin-top: 6px;">
                            <label>Active Target Source Blueprint Remote Resource URL Location Target:</label>
                            <input type="text" id="test-url-field" placeholder="https://githubusercontent.com" onchange="syncPanelData('source')">
                        </div>
                        <div id="test-input-container" style="margin-top: 6px;">
                            <label>Raw Target Source Blueprint Script Payload Editor Buffer:</label>
                            <textarea id="test-json-area" placeholder="Awaiting target workspace blueprint dataset ingestion loop..." oninput="handleTypingState('source')" style="height: 160px;"></textarea>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px; margin-top: 8px;">
                        <button class="secondary" onclick="exportSettingsJsonFile()" style="font-size: 11px; padding: 4px 8px;">Backup Profiles</button>
                    </div>
                </div>

                <!-- 🧩 Box 4: THE CHECK BOX clipboard validator panel (Cleaned of extra fields) -->
                <div class="panel">
                    <h2>4. Session Token Intercept Check</h2>
                    <label>Pasted Clipboard Session Intercept Snapshot Container Area:</label>
                    <textarea id="session-input" placeholder="Paste live AI response variables block directly here..." style="height: 140px; margin-bottom: 8px;"></textarea>
                    <button onclick="executeCryptographicVerificationDiff()">Execute Cryptographic Evaluation Diff</button>
                </div>
            </div>

        <!-- System Diagnostic Log & Engine Controls Panel -->
        <div class="panel">
            <h2>System Debug Diagnostic Execution Log</h2>
            <div id="local-log" class="log-box"></div>
            <div style="display:flex; justify-content:space-between; align-items: center; gap:10px; flex-wrap: wrap;">
                <div style="display:flex; gap:8px;">
                    <button onclick="document.getElementById('local-log').innerHTML='';" class="secondary" style="padding: 4px 8px; font-size:11px;">Flush View Logs</button>
                    <button class="danger" onclick="executeFactoryResetPurge()" style="padding: 4px 8px; font-size:11px;">Purge Storage</button>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <label style="margin:0;">Selected Hashing Variant:</label>
                    <select id="algo-select" onchange="handleManualAlgoOverride()" style="margin:0; width:160px;">
                        <option value="md5">MD5 (Fast / Verified)</option>
                        <option value="sha1">SHA-1 (Legacy)</option>
                        <option value="sha256">SHA-256 (Secure)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
